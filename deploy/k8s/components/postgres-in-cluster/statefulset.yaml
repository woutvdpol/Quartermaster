apiVersion: v1
kind: Service
metadata:
  name: quartermaster-postgres
  labels:
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: quartermaster
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quartermaster-postgres
  labels:
    app.kubernetes.io/component: database
spec:
  serviceName: quartermaster-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quartermaster
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quartermaster
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        # uid/gid of the `postgres` user in the Debian-based pgvector image (the Alpine image used 70).
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Postgres 18 + pgvector (smart search, docs/search.md). Switching an existing volume from
          # postgres:18-alpine: chown the PVC to 999 and REINDEX once (musl vs glibc collation).
          image: pgvector/pgvector:pg18
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: quartermaster
            - name: POSTGRES_DB
              value: quartermaster
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quartermaster-postgres
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quartermaster", "-d", "quartermaster", "-h", "127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "quartermaster", "-d", "quartermaster", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Postgres 18 images keep PGDATA in /var/lib/postgresql/18/docker (mount the parent).
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quartermaster-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: quartermaster
      app.kubernetes.io/component: database
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quartermaster
      ports:
        - port: 5432
          protocol: TCP
