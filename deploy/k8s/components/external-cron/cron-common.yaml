# Common spec merged into every CronJob of this component (patch target: component=cron).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: common
spec:
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: quartermaster
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          serviceAccountName: quartermaster
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: curlimages/curl:8.16.0
              imagePullPolicy: IfNotPresent
              # The Bearer token is read from a header file so it never appears in the process list.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  printf 'Authorization: Bearer %s\n' "${CRON_SECRET}" > /tmp/auth
                  curl -fsS --max-time 540 --retry 2 --retry-connrefused -X POST \
                    -H @/tmp/auth "http://quartermaster-web/api/cron/${CRON_TASK}"
                  echo
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: quartermaster-secrets
                      key: CRON_SECRET
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
