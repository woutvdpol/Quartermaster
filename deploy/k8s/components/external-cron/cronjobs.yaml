# Generated list — keep in sync with CRON_TASKS in src/server/jobs/cron.ts (schedules in UTC).
# Each CronJob only sets its task name; image, command and env come from cron-common.yaml.
---
# Flip expired cart reservations to EXPIRED
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quartermaster-cron-reservations-expire
  labels:
    app.kubernetes.io/component: cron
spec:
  schedule: "* * * * *"
  timeZone: Etc/UTC
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: trigger
              env:
                - name: CRON_TASK
                  value: reservations.expire
---
