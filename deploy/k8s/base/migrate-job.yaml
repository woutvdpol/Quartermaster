# `prisma migrate deploy` (Dockerfile target `migrate`). Must complete BEFORE new web/worker pods
# roll out. Jobs are immutable, so the Job is deleted and re-created for every release:
#   deploy/k8s/rollout.sh overlays/<env>     (kubectl; see docs/deploy.md "Migraties")
# Argo CD: the annotations below turn it into a PreSync hook (runs first, re-created each sync).
# Flux: put this Job in its own Kustomization and make the app Kustomization `dependsOn` it
# (with `force: true` so the immutable Job is replaced).
# prisma migrate deploy is idempotent and takes a Postgres advisory lock, so a re-run is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: quartermaster-migrate
  labels:
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quartermaster
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: quartermaster
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: quartermaster-migrate
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quartermaster-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
