# Next.js standalone server (Dockerfile target `runner`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quartermaster-web
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: quartermaster
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quartermaster
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: quartermaster
      automountServiceAccountToken: false
      # No *_SERVICE_HOST/PORT env vars injected (keeps the env clean; PORT stays ours).
      enableServiceLinks: false
      # preStop sleep (10 s) + Next.js draining in-flight requests on SIGTERM.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: quartermaster
              app.kubernetes.io/component: web
          matchLabelKeys: ["pod-template-hash"]
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: quartermaster
              app.kubernetes.io/component: web
          matchLabelKeys: ["pod-template-hash"]
      containers:
        - name: web
          image: quartermaster
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: quartermaster-config
            - secretRef:
                name: quartermaster-secrets
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # Keep the V8 heap below the memory limit (sharp/libvips allocate outside the heap).
            - name: NODE_OPTIONS
              value: "--max-old-space-size=640"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # Startup: up to 2 minutes before liveness takes over.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          # Liveness: process only — /api/health never touches the database, so a DB outage
          # does not restart pods.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: /api/ready runs SELECT 1; returns 503 while Postgres is unreachable.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Give the endpoints controller / ingress time to stop routing to this pod before
            # Next.js receives SIGTERM and closes its listener.
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: quartermaster-uploads
        # Per-pod Next.js data/image cache (unstable_cache, next/image). Not shared between pods.
        - name: next-cache
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
