# TEMPLATE ONLY — never commit real values. Create the Secrets out-of-band, e.g.
#   kubectl -n quartermaster create secret generic quartermaster-secrets --from-env-file=prod.secrets.env
# or manage them with Sealed Secrets / External Secrets Operator / SOPS. The manifests only
# reference the Secret names below; nothing in deploy/k8s creates them.
#
# Non-secret settings live in the ConfigMap (deploy/k8s/base/kustomization.yaml + overlays).
apiVersion: v1
kind: Secret
metadata:
  name: quartermaster-secrets
type: Opaque
stringData:
  # Required. node-postgres/libpq URL; the backup CronJob uses it for pg_dump as well.
  # Managed Postgres: add ?sslmode=require (or verify-full + CA).
  DATABASE_URL: "postgresql://quartermaster:CHANGE_ME@postgres.example.invalid:5432/quartermaster?sslmode=require"
  # Required. 32 random bytes, base64. Encrypts TOTP secrets, payment credentials, analytics salts …
  # NEVER rotate casually: existing encrypted data becomes unreadable.
  #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  APP_ENCRYPTION_KEY: "CHANGE_ME"
  # Required in production (without it mail jobs fail and retry). smtps://user:pass@host:465
  SMTP_URL: "smtps://CHANGE_ME:CHANGE_ME@smtp.example.invalid:465"
  # Required for public shop forms in production (empty = forms are DENIED). The matching public
  # site key is a Docker build arg (NEXT_PUBLIC_TURNSTILE_SITE_KEY), not runtime config.
  TURNSTILE_SECRET_KEY: "CHANGE_ME"
  # Bearer token for POST /api/cron/<task>; ≥16 chars, empty disables the endpoint. Only needed with
  # components/external-cron.  node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
  CRON_SECRET: ""
  # Required for smart search: shared secret between web/worker and the embedder service (≥ 32 chars).
  #   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
  # Empty/missing: the embedder refuses to start; web/worker fall back to lexical search.
  EMBEDDER_TOKEN: "CHANGE_ME"
  # Optional: Matomo API token (only sent to MATOMO_URL).
  MATOMO_TOKEN: ""
  # Optional: web push for logged-in shop customers (docs/push.md). One key pair for the platform:
  #   npx web-push generate-vapid-keys
  # Empty = push off (the shop hides every push option). Changing the pair invalidates every device.
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  VAPID_SUBJECT: "mailto:CHANGE_ME@example.invalid"
---
# components/postgres-in-cluster only: password for the in-cluster Postgres StatefulSet.
# DATABASE_URL above must then be postgresql://quartermaster:<same password>@quartermaster-postgres:5432/quartermaster
apiVersion: v1
kind: Secret
metadata:
  name: quartermaster-postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME"
---
# Optional: offsite target for the backup CronJob (rclone, any S3-compatible store: AWS S3,
# Cloudflare R2, Backblaze B2, Scaleway, MinIO, …). Without this Secret backups stay on the PVC.
apiVersion: v1
kind: Secret
metadata:
  name: quartermaster-backup-offsite
type: Opaque
stringData:
  BACKUP_BUCKET: "quartermaster-backups"
  RCLONE_CONFIG_OFFSITE_TYPE: "s3"
  RCLONE_CONFIG_OFFSITE_PROVIDER: "Other"        # AWS | Cloudflare | Scaleway | Minio | Other …
  RCLONE_CONFIG_OFFSITE_ENDPOINT: "https://s3.example.invalid"
  RCLONE_CONFIG_OFFSITE_REGION: "auto"
  RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: "CHANGE_ME"
  RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: "CHANGE_ME"
  # Server-side encryption is provider-specific; or wrap the remote in an rclone `crypt` remote.
