# Local development services.
#   docker compose up -d postgres            -> database only; run the app on the host (`npm run dev`)
#   docker compose --profile app up -d --build -> database + migrations + containerised app
services:
  postgres:
    image: postgres:18-alpine
    container_name: quartermaster-postgres
    environment:
      POSTGRES_USER: quartermaster
      POSTGRES_PASSWORD: quartermaster
      POSTGRES_DB: quartermaster
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quartermaster -d quartermaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending Prisma migrations, then exits.
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    image: quartermaster-migrate:dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://quartermaster:quartermaster@postgres:5432/quartermaster
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    profiles: ["app"]
    build:
      context: .
      target: runner
    image: quartermaster:dev
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the Compose network Postgres is reachable as `postgres:5432`.
      DATABASE_URL: postgresql://quartermaster:quartermaster@postgres:5432/quartermaster
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
