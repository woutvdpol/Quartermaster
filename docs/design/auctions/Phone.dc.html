<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bidding on the phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
button{font:inherit;cursor:pointer}
a{color:#1E2119}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1E2119; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
  <sc-if value="{{showShop}}" hint-placeholder-val="{{true}}">
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #E8E8E2">
      <strong style="font-size: 17px">Concept Militaria</strong>
      <span style="font: 500 12px 'IBM Plex Mono', monospace; color: #7A2420">Lot 17 · Autumn Auction</span>
    </header>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px">
      <span style="aspect-ratio: 4 / 3; border-radius: 10px; background: #D9D8CF; display: block"></span>
      <strong style="font-size: 20px; line-height: 1.2">Stahlhelm M40 Heer, ET64</strong>
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <span><span style="font-size: 12px; color: #6B6E60">Current bid</span><br><b style="font-size: 28px">{{current}}</b></span>
        <span style="text-align: right"><span style="font-size: 12px; color: #6B6E60">Closes in</span><br><b style="font: 600 22px 'IBM Plex Mono', monospace">{{clock}}</b></span>
      </div>
      <div role="status" style="border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; background: {{statusBg}}; color: {{statusFg}}">{{statusText}}</div>
      <sc-if value="{{won}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
          <span style="font-size: 14px; color: #4A4D40">Pay within 5 days. Shipping to the Netherlands €6.95.</span>
          <button type="button" style="height: 54px; border: 0; border-radius: 999px; background: #1F4D3A; color: #FFFFFF; font-weight: 600; font-size: 16px">Pay €1,606.95</button>
        </div>
      </sc-if>
      <sc-if value="{{canBid}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
          <button type="button" onClick="{{next}}" style="height: 54px; border: 0; border-radius: 999px; background: #1F4D3A; color: #FFFFFF; font-weight: 600; font-size: 16px">{{bidLabel}}</button>
          <button type="button" style="height: 46px; border: 1px solid #D4D4CC; border-radius: 999px; background: #FFFFFF">Set a maximum bid…</button>
        </div>
      </sc-if>
      <sc-if value="{{waiting}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{next}}" style="margin-top: auto; height: 46px; border: 1px dashed #B7B49F; border-radius: 999px; background: #FFFFFF; color: #4A4D40">Simulate: someone bids more</button>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{showPush}}" hint-placeholder-val="{{false}}">
    <div style="flex-grow: 1; background: #1E2119; color: #FFFFFF; padding: 24px 14px; display: flex; flex-direction: column; gap: 12px">
      <span style="text-align: center; font-size: 56px; font-weight: 300; margin-top: 40px">20:14</span>
      <span style="text-align: center; font-size: 14px; opacity: 0.8; margin-bottom: 28px">Sunday 9 November</span>
      <button type="button" onClick="{{next}}" style="text-align: left; border: 0; color: #FFFFFF; background: rgba(255,255,255,0.16); border-radius: 18px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start">
        <span style="width: 38px; height: 38px; border-radius: 9px; background: #FFFFFF; color: #1E2119; display: grid; place-items: center; font-weight: 700; flex-shrink: 0">CM</span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; opacity: 0.8">Concept Militaria · now</span>
          <b style="font-size: 14px">Outbid on Lot 17 — now €1,500</b>
          <span style="font-size: 13px; opacity: 0.9">Stahlhelm M40 Heer · closes in 1:52. Tap to bid again.</span>
        </span>
      </button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { s: 1 }; }
renderVals() {
const s = this.state.s;
const st = {
1: { current: '€1,400', clock: '06:12', text: 'Not bidding yet', bg: '#F3F3EE', fg: '#4A4D40' },
2: { current: '€1,450', clock: '05:40', text: 'You are the highest bidder', bg: '#DCEBD9', fg: '#1F4D3A' },
4: { current: '€1,500', clock: '01:52', text: 'Outbid by Bidder 12', bg: '#F5E7C4', fg: '#6E4A00' },
5: { current: '€1,600', clock: '00:00', text: 'You won this lot for €1,600', bg: '#DCEBD9', fg: '#1F4D3A' }
}[s] || {};
return {
showShop: s !== 3, showPush: s === 3,
current: st.current, clock: st.clock, statusText: st.text, statusBg: st.bg, statusFg: st.fg,
canBid: s === 1 || s === 4, waiting: s === 2, won: s === 5,
bidLabel: s === 4 ? 'Bid €1,600 (max)' : 'Bid €1,450',
next: () => this.setState({ s: s >= 5 ? 1 : s + 1 })
};
}
}
</script>
</body>
</html>
