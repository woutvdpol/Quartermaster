<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search as you type</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#141414;text-decoration:none}a:hover{color:#1F4D3A}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; color: #141414; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px">
  <header style="border-bottom: 1px solid #ECECEA">
    <div style="max-width: 1360px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
      <a href="#" style="font-weight: 700; font-size: 20px; letter-spacing: -0.02em">Concept Militaria</a>
      <nav aria-label="Categories" style="display: flex; gap: 20px; font-weight: 500; color: #3D3D3A"><a href="#">Shop</a><a href="#">Helmets</a><a href="#">Uniforms</a><a href="#">Insignia</a></nav>
      <div style="margin-left: auto; position: relative; flex: 0 1 520px; min-width: 280px">
        <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #141414; border-radius: 999px; padding: 0 6px 0 16px; height: 46px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <label style="flex-grow: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</span><input type="search" value="{{q.text}}" readonly style="border: 0; outline: none; font: inherit; width: 100%; background: transparent"></label>
          <button type="button" aria-label="Search by photo" title="Search by photo" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: #F3F3F1; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
        </div>

        <div role="listbox" aria-label="Suggestions" style="position: absolute; top: 54px; left: 0; right: 0; background: #FFFFFF; border: 1px solid #ECECEA; border-radius: 6px; box-shadow: 0 16px 48px rgba(20,20,20,0.18); overflow: hidden; z-index: 5">
          <div style="padding: 12px 16px; border-bottom: 1px solid #ECECEA; display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
            <span style="font-size: 12px; color: #6A6862; margin-right: 4px">Understood as</span>
            <sc-for list="{{q.chips}}" as="c" hint-placeholder-count="2">
              <span style="display: inline-flex; align-items: center; gap: 6px; background: #E8EFEB; color: #1F4D3A; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600">{{c}}</span>
            </sc-for>
            <span style="font-size: 13px; color: #3D3D3A">+ “{{q.rest}}”</span>
          </div>
          <div style="padding: 10px 8px 4px">
            <span style="display: block; padding: 0 8px 6px; font-size: 12px; color: #6A6862">Categories &amp; filters</span>
            <sc-for list="{{q.facets}}" as="f" hint-placeholder-count="2">
              <a href="#" role="option" style="display: flex; justify-content: space-between; padding: 8px; border-radius: 6px"><span>{{f.label}}</span><span style="color: #6A6862; font-size: 13px">{{f.count}}</span></a>
            </sc-for>
          </div>
          <div style="padding: 4px 8px 8px">
            <span style="display: block; padding: 6px 8px; font-size: 12px; color: #6A6862">Items</span>
            <sc-for list="{{q.items}}" as="p" hint-placeholder-count="4">
              <a href="#" role="option" style="{{p.rowStyle}}">
                <span style="width: 44px; height: 54px; border-radius: 6px; background: #F3F3F1; flex-shrink: 0"></span>
                <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7A2420">No. {{p.code}}</span>
                  <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.title}}</span>
                  <span style="font-size: 12px; color: #6A6862">{{p.why}}</span>
                </span>
                <span style="font-weight: 700">{{p.price}}</span>
              </a>
            </sc-for>
          </div>
          <a href="#" style="display: flex; justify-content: space-between; padding: 14px 16px; background: #F3F3F1; font-weight: 600"><span>See all {{q.total}} results</span><span>↵</span></a>
        </div>
      </div>
    </div>
  </header>

  <section style="max-width: 1360px; margin: 0 auto; padding: 380px 32px 40px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; color: #6A6862">Try a query (prototype):</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{examples}}" as="e" hint-placeholder-count="4">
        <button type="button" onClick="{{e.pick}}" aria-pressed="{{e.on}}" style="{{e.style}}">{{e.label}}</button>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { i: 0 }; }
renderVals() {
const Q = [
  { text: 'duitse helm ww2 onder 500', chips: ['Country: Germany', 'Period: WW2', 'Price ≤ €500'], rest: 'helm', facets: [{ label: 'Steel helmets › German', count: '6 items' }, { label: 'Headgear › Field caps', count: '3 items' }], total: 9,
    items: [{ code: '50170', title: 'Stahlhelm M35, Heer, single decal', why: 'Matches: helmet · Germany · WW2', price: '€485' }, { code: '50171', title: 'Stahlhelm M40, camouflage traces', why: 'Matches: helmet · Germany · WW2', price: '€420' }, { code: '50176', title: 'Luftschutz Gladiator helmet', why: 'Similar: helmet · Germany', price: '€165' }] },
  { text: 'feldbluse met kraagspiegels', chips: [], rest: 'feldbluse met kraagspiegels', facets: [{ label: 'Uniforms › Tunics & jackets', count: '7 items' }], total: 4,
    items: [{ code: '50181', title: 'Feldbluse M36, infantry Obergefreiter', why: 'Meaning match: tunic with collar tabs', price: '€1,845' }, { code: '50185', title: 'Waffenrock M10, feldgrau', why: 'Meaning match: field-grey tunic', price: '€1,350' }, { code: '50183', title: 'British Battledress blouse P37, 1943', why: 'Related: field blouse', price: '€245' }] },
  { text: 'stahlhem', chips: [], rest: 'stahlhem → stahlhelm', facets: [{ label: 'Steel helmets', count: '8 items' }], total: 8,
    items: [{ code: '50172', title: 'Bundeswehr M56 Stahlhelm', why: 'Typo corrected: stahlhelm', price: '€45' }, { code: '50170', title: 'Stahlhelm M35, Heer, single decal', why: 'Typo corrected: stahlhelm', price: '€485' }] },
  { text: '50212', chips: ['Item No. 50212'], rest: '', facets: [], total: 1,
    items: [{ code: '50212', title: 'Iron Cross 2nd class 1914', why: 'Exact item number', price: '€145' }] }
];
const q = Q[this.state.i];
q.items = q.items.map((p, j) => Object.assign({}, p, { rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 6px;' + (j === 0 ? ' background: #F3F3F1;' : '') }));
return {
  q: q,
  examples: Q.map((x, i) => ({ label: x.text, on: i === this.state.i ? 'true' : 'false', pick: () => this.setState({ i: i }), style: 'height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; ' + (i === this.state.i ? 'background: #141414; color: #FFFFFF; border: 1px solid #141414;' : 'background: #FFFFFF; color: #141414; border: 1px solid #CFCDC6;') }))
};
}
}
</script>
</body>
</html>
