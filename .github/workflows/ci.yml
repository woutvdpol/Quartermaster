name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector: product embeddings for smart search (docs/search.md).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: quartermaster
          POSTGRES_PASSWORD: quartermaster
          POSTGRES_DB: quartermaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quartermaster -d quartermaster"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://quartermaster:quartermaster@localhost:5432/quartermaster
      DATABASE_URL_TEST: postgresql://quartermaster:quartermaster@localhost:5432/quartermaster_test
      PLATFORM_HOST: localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      # onnxruntime-node (smart-search embedder dependency) would fetch CUDA libraries on linux/x64.
      ONNXRUNTIME_NODE_INSTALL: skip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate dummy encryption key
        run: echo "APP_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"

      - name: Install dependencies (runs prisma generate)
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npx next typegen
          npm run typecheck

      - name: Test
        run: npm test

      - name: Integration test
        run: |
          PGPASSWORD=quartermaster psql -h localhost -U quartermaster -d quartermaster -c "CREATE DATABASE quartermaster_test"
          npm run test:integration

      - name: Build
        run: npm run build

      # End-to-end smoke tests against the production build (`next start`) and a seeded database.
      # Uses http://localhost:3001 — seeded as a secondary domain of the demo tenant (prisma/seed.ts).
      - name: Seed demo data for e2e
        env:
          SEED_SUPERADMIN_EMAIL: admin@e2e.test
          SEED_SUPERADMIN_PASSWORD: e2e-only-password-not-secret
          SEED_OWNER_EMAIL: owner@e2e.test
          SEED_OWNER_PASSWORD: e2e-only-password-not-secret
          UPLOADS_DIR: ${{ github.workspace }}/uploads
        run: |
          npm run db:seed
          npm run db:seed:demo

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        env:
          E2E_WEB_SERVER: "1"
          E2E_BASE_URL: http://localhost:3001
          UPLOADS_DIR: ${{ github.workspace }}/uploads
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: quartermaster:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          tags: quartermaster-migrate:ci
          cache-from: type=gha

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: quartermaster-worker:ci
          cache-from: type=gha

      # Smart-search models service. No models are baked in or downloaded here (they are fetched into
      # the model volume at first start / by the k8s initContainer).
      - name: Build embedder image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: embedder
          push: false
          tags: quartermaster-embedder:ci
          cache-from: type=gha

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Render overlays (kustomize)
        run: |
          mkdir -p rendered
          for o in staging production; do
            kubectl kustomize "deploy/k8s/overlays/$o" > "rendered/$o.yaml"
          done

      - name: Validate against the Kubernetes schema (kubeconform)
        run: |
          docker run --rm -v "$PWD/rendered:/w:ro" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.33.0 /w/staging.yaml /w/production.yaml
