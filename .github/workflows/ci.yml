name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: quartermaster
          POSTGRES_PASSWORD: quartermaster
          POSTGRES_DB: quartermaster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quartermaster -d quartermaster"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://quartermaster:quartermaster@localhost:5432/quartermaster
      PLATFORM_HOST: localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate dummy encryption key
        run: echo "APP_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"

      - name: Install dependencies (runs prisma generate)
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npx next typegen
          npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: quartermaster:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          tags: quartermaster-migrate:ci
          cache-from: type=gha
