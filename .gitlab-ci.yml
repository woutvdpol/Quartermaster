# GitLab CI: quick checks, then build the four container images and push them to this project's
# container registry ($CI_REGISTRY_IMAGE). The full suite (integration tests against Postgres, e2e,
# Kubernetes manifest validation) runs on GitHub Actions (.github/workflows/ci.yml).
#
# Images (all from one Dockerfile, same commit, same tag):
#   $CI_REGISTRY_IMAGE:<tag>            web (Next.js standalone, target runner)
#   $CI_REGISTRY_IMAGE/worker:<tag>     pg-boss worker
#   $CI_REGISTRY_IMAGE/migrate:<tag>    prisma migrate deploy / ETL
#   $CI_REGISTRY_IMAGE/embedder:<tag>   smart-search + translation models service
# Tags: the short commit SHA always; `main` + `latest` on the default branch; the git tag for tags.
#
# Release: pushing a protected `v*` tag (e.g. v0.2.0) builds the images with that tag, then the
# `release` job pins it in the gitops repo (quartermaster/overlays/k3s); Argo CD syncs from there
# (migrations first, then the app). Pushes to main only build images, they never deploy.
#
# Optional CI/CD variables (Settings → CI/CD → Variables):
#   NEXT_COMPRESS=false   for images behind an ingress that compresses (docs/deploy.md)
# Required for `release` (protected + masked, so only protected tags can read it):
#   GITOPS_DEPLOY_KEY_B64 base64 of the private SSH key of a write deploy key on the gitops repo

stages:
  - check
  - build
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  # onnxruntime-node (embedder dependency) would download CUDA libraries on linux/x64.
  ONNXRUNTIME_NODE_INSTALL: skip

check:
  stage: check
  image: node:24-bookworm-slim
  timeout: 20m
  variables:
    # Only read at import time by a few modules; no database is used by these checks.
    DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    PLATFORM_HOST: localhost:3000
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl ca-certificates > /dev/null
    - export APP_ENCRYPTION_KEY="$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - npm run lint
    - npx next typegen
    - npm run typecheck
    - npm test

# Rootless BuildKit in the job container itself: no Docker daemon, no privileged pod. The runner gives the
# build container Unconfined seccomp/AppArmor, which rootlesskit needs for its user namespace.
.build:
  stage: build
  image:
    name: moby/buildkit:v0.34.0-rootless
    entrypoint: [""]
  timeout: 45m
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    # buildctl reads registry credentials from the Docker config.
    - mkdir -p ~/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > ~/.docker/config.json
  script:
    - |
      set -eu
      TAGS="$CI_COMMIT_SHORT_SHA"
      if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then TAGS="$TAGS main latest"; fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then TAGS="$TAGS $CI_COMMIT_TAG"; fi
      PUSH="${PUSH_IMAGES:-true}"
      CACHE="$CI_REGISTRY_IMAGE/cache"
      build() { # build <target> <image>
        target="$1"; image="$2"; names=""
        for t in $TAGS; do names="${names:+$names,}$image:$t"; done
        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 --local context=. --local dockerfile=. \
          --opt target="$target" \
          --opt build-arg:NEXT_DEPLOYMENT_ID="$CI_COMMIT_SHORT_SHA" \
          --opt build-arg:NEXT_COMPRESS="${NEXT_COMPRESS:-true}" \
          --import-cache "type=registry,ref=$CACHE:$target" \
          --export-cache "type=registry,ref=$CACHE:$target,mode=max" \
          --opt label:org.opencontainers.image.revision="$CI_COMMIT_SHA" \
          --opt label:org.opencontainers.image.source="$CI_PROJECT_URL" \
          --output "type=image,\"name=$names\",push=$PUSH"
      }
      for spec in $IMAGES; do
        target="${spec%%=*}"; suffix="${spec#*=}"
        build "$target" "$CI_REGISTRY_IMAGE$suffix"
      done
      echo "Built: $IMAGES with tags: $TAGS"

# Web + worker + migrate share the deps/build stages, so they build in one job (one layer cache).
build:app:
  extends: .build
  variables:
    IMAGES: "runner= worker=/worker migrate=/migrate"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables: { PUSH_IMAGES: "false" }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# The embedder has its own small dependency set; models are not baked in (fetched into a volume).
build:embedder:
  extends: .build
  variables:
    IMAGES: "embedder=/embedder"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [src/embedder/**/*, package.json, package-lock.json, Dockerfile]
      variables: { PUSH_IMAGES: "false" }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

# Pin the release tag in the gitops repo. Only for protected v* tags, after every image is pushed.
release:
  stage: release
  image: alpine:3.21
  needs: [build:app, build:embedder]
  interruptible: false
  resource_group: gitops-release
  variables:
    GITOPS_REPO: git@gitlab.com:persoonlijk5372342/gitops.git
    OVERLAY: quartermaster/overlays/k3s/kustomization.yaml
    # gitlab.com host key (fingerprint SHA256:eUXGGm1YGsMAS7vkcx6JOJdOGHPem5gQp4taiCfCLB8).
    GITLAB_HOST_KEY: "gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/ && $CI_COMMIT_REF_PROTECTED == "true"
  before_script:
    - apk add --no-cache git openssh-client > /dev/null
    - test -n "${GITOPS_DEPLOY_KEY_B64:-}" || { echo "GITOPS_DEPLOY_KEY_B64 is not set (protected variable)"; exit 1; }
    - install -d -m 700 ~/.ssh
    - echo "$GITOPS_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - echo "$GITLAB_HOST_KEY" > ~/.ssh/known_hosts
    - git config --global user.name "Quartermaster release"
    - git config --global user.email "release@noreply.gitlab.com"
  script:
    - |
      set -eu
      git clone --depth 1 "$GITOPS_REPO" gitops && cd gitops
      # The overlay's `images:` block is the only place with newTag; all four images share the tag.
      sed -i -E "s/^(    newTag: ).*/\1${CI_COMMIT_TAG}/" "$OVERLAY"
      [ "$(grep -c "^    newTag: ${CI_COMMIT_TAG}\$" "$OVERLAY")" -eq 4 ] || { echo "expected 4 image tags in $OVERLAY"; git diff; exit 1; }
      if git diff --quiet; then echo "gitops already at ${CI_COMMIT_TAG}"; exit 0; fi
      git commit -qam "Release Quartermaster ${CI_COMMIT_TAG}" -m "From ${CI_PROJECT_URL}/-/tags/${CI_COMMIT_TAG} (${CI_COMMIT_SHORT_SHA})."
      for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase -q origin main; done
      exit 1
